name: native-mcmc-lite
# P-ACT lite: Planck (plik-lite cortado) + ACT DR6 lite + low-l + lensings + SPT-3G lite; 5 modelos x 4 cadeias; checkpoints em mcmc-lite
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      only_test: { description: "so teste de inicializacao", required: false, default: "false" }
concurrency:
  group: native-mcmc-lite
  cancel-in-progress: false
permissions:
  contents: write
env:
  PKG: ${{ github.workspace }}/packages
  SPTDIR: ${{ github.workspace }}/spt_candl_data
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-lite.txt }
      - run: pip install -r requirements-lite.txt
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            packages
            spt_candl_data
          key: data-lite-v1-${{ hashFiles('scripts/make_lite_yaml.py', 'requirements-lite.txt') }}
      - name: Instala dados
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$PKG"
          git clone https://github.com/SouthPoleTelescope/spt_candl_data "$SPTDIR"
          git -C "$SPTDIR" checkout f22611a9671d50af6135f048a2ea3f43ef4c2f62
          python scripts/make_lite_yaml.py LCDM 0 "$PKG" "$SPTDIR" run/_prep
          cobaya-install run/LCDM_c0.yaml --packages-path "$PKG" --no-progress-bars
      - name: Teste de inicializacao dos 5 modelos
        run: |
          fail=0
          for m in LCDM LCDM_Alens w0waCDM PEER1P PEER1P_Alens; do
            python scripts/make_lite_yaml.py $m 0 "$PKG" "$SPTDIR" run/_test_$m
            cobaya-run --test run/${m}_c0.yaml > test_$m.log 2>&1; rc=$?; tail -4 test_$m.log; if [ $rc -ne 0 ]; then echo "::error::teste de $m falhou"; fail=1; fi
          done
          exit $fail
  chains:
    needs: prep
    if: ${{ github.event.inputs.only_test != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        model: [LCDM, LCDM_Alens, w0waCDM, PEER1P, PEER1P_Alens]
        chain: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: mcmc-lite, path: ckpt }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-lite.txt }
      - run: pip install -r requirements-lite.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            packages
            spt_candl_data
          key: data-lite-v1-${{ hashFiles('scripts/make_lite_yaml.py', 'requirements-lite.txt') }}
          fail-on-cache-miss: true
      - name: Gera YAML e restaura checkpoint
        run: |
          D=chains/${{ matrix.model }}_c${{ matrix.chain }}
          python scripts/make_lite_yaml.py ${{ matrix.model }} ${{ matrix.chain }} "$PKG" "$SPTDIR" "$D"
          if ls ckpt/$D/chain.*.txt >/dev/null 2>&1; then cp -a ckpt/$D/. "$D"/; echo "checkpoint restaurado"; else echo "sem checkpoint valido: inicio limpo"; fi
      - name: Roda MCMC (retoma)
        env: { OMP_NUM_THREADS: "4", COBAYA_PACKAGES_PATH: "${{ github.workspace }}/packages" }
        run: |
          set +e
          timeout 20400 cobaya-run -r run/${{ matrix.model }}_c${{ matrix.chain }}.yaml
          rc=$?
          echo "cobaya-run rc=$rc"
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then echo "::error::cobaya-run falhou (rc=$rc)"; exit $rc; fi
      - name: Commit do checkpoint
        if: always()
        run: |
          D=chains/${{ matrix.model }}_c${{ matrix.chain }}
          [ -d "$D" ] || exit 0
          cd ckpt 2>/dev/null || { mkdir ckpt && cd ckpt && git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" && git checkout -q -b mcmc-lite; }
          mkdir -p "$D" && cp -a "../$D/." "$D"/
          git config user.name "mcmc-bot"; git config user.email "mcmc-bot@users.noreply.github.com"
          git add -A "$D" && git commit -q -m "checkpoint ${{ matrix.model }} c${{ matrix.chain }} $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin mcmc-lite 2>/dev/null || true; git push -q origin HEAD:mcmc-lite && break || sleep $((RANDOM % 20 + 5)); done
  aggregate:
    needs: chains
    if: always() && needs.chains.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: mcmc-lite, path: ckpt }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install numpy
      - run: python scripts/aggregate.py ckpt
      - name: Commit do resumo
        run: |
          cd ckpt && git config user.name "mcmc-bot" && git config user.email "mcmc-bot@users.noreply.github.com"
          git add -A summary && git commit -q -m "summary $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin mcmc-lite; git push -q origin HEAD:mcmc-lite && break || sleep 10; done
      - run: cat ckpt/summary/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
